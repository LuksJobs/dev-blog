baseurl: https://example.com
languageCode: en-us
theme: hugo-theme-stack
paginate: 8
title: Lucas Oliveira
copyright: Lucas Oliveira Dantas

languages:
    en:
        languageName: English
        title: Lucas Oliveira
        weight: 1
        params:
            description: First, solve the problem. Then, write the code.
    #zh-cn:
        #languageName: 中文
        #title: 演示站点
        #weight: 2
        #params:
            #description: 演示说明
    #ar:
        #languageName: عربي
        #languagedirection: rtl
        #title: موقع تجريبي
        #weight: 3
        #params:
            #description: وصف تجريبي

# Change it to your Disqus shortname before using
disqusShortname: https-luks-dev-br

# GA Tracking ID
googleAnalytics:

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: en

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /icons/favicon.svg # e.g. favicon.ico

    footer:
        since: 2021
        customText:

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 🍥
        subtitle: First, solve the problem. Then, write the code.
        avatar:
            enabled: true
            local: true
            src: img/avatar.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: disqus

        disqus:
            shortname:
            # hideWhenLocal: true

        utterances:
            repo:
            issueTerm: pathname
            label:

        remark42:
            host:
            site:
            # completeURL: false
            # hideWhenLocal: true

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled:
            emitMetadata:

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: false
        startLevel: 2
    highlight:
        # lineNos: true
        # lineNumbersInTable: true
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNos: true
        style: monokai