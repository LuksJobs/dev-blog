baseurl: https://example.com
languageCode: pt-BR
paginate: 8
title: Lucas Oliveira
copyright: Lucas Oliveira Dantas

# Português é o idioma principal (servido na raiz, ex.: /p/slug/).
# Inglês fica em /en/. Para traduzir um artigo, crie um arquivo
# "<nome>.en.md" ao lado do original "<nome>.md".
languages:
    pt-br:
        languageName: Português
        languageCode: pt-BR
        title: Lucas Oliveira
        weight: 1
        params:
            description: Primeiro, resolva o problema. Depois, escreva o código.
            # Código do idioma usado pelo Google Translate
            translateCode: pt
            readIn: Ler em português
    en:
        languageName: English
        languageCode: en-US
        title: Lucas Oliveira
        weight: 2
        params:
            description: First, solve the problem. Then, write the code.
            translateCode: en
            readIn: Read in English

# Change it to your Disqus shortname before using
disqusShortname: https-luks-dev-br

# GA Tracking ID
googleAnalytics:

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: pt-br

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /icons/favicon.svg # e.g. favicon.ico

    footer:
        since: 2021
        customText:

    # Formatos localizados (ex.: "26 de nov. de 2025" / "Nov 26, 2025")
    dateFormat:
        published: ":date_medium"
        lastUpdated: ":date_medium"

    # Idiomas oferecidos apenas por tradução automática (Google Translate)
    autoTranslate:
        - code: es
          label: Español
          readIn: Leer en español

    # Na versão em inglês, lista também os artigos ainda não traduzidos
    # (com link para a tradução automática)
    showUntranslated: true

    # Carrossel de posts do X exibido abaixo da busca.
    # Cole o link de cada post (o mais recente primeiro). Texto, mídia e data
    # são buscados automaticamente no build; posts indisponíveis são ignorados.
    xFeed:
        posts:
            - https://x.com/luksjobs/status/1972500402567602246
            - https://x.com/luksjobs/status/1863341966374629535
            - https://x.com/luksjobs/status/1753384053967860141
            - https://x.com/luksjobs/status/2051437291629941018

    sidebar:
        emoji: 🍥
        subtitle: First, solve the problem. Then, write the code.
        avatar:
            enabled: true
            local: true
            src: img/avatar.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: disqus

        disqus:
            shortname:
            # hideWhenLocal: true

        utterances:
            repo:
            issueTerm: pathname
            label:

        remark42:
            host:
            site:
            # completeURL: false
            # hideWhenLocal: true

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled:
            emitMetadata:

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: false
        startLevel: 2
    highlight:
        # lineNos: true
        # lineNumbersInTable: true
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNos: true
        style: monokai